<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>

    <title>Student Management</title>

</h:head>

<h:body>

    <h:form id="studentForm">

        <p:panel header="Student Management">

            <p:panelGrid columns="2">

                <h:outputLabel value="First Name:"/>

                <p:inputText
                        value="#{studentBean.student.firstName}"
                        required="true"/>


                <h:outputLabel value="Last Name:"/>

                <p:inputText
                        value="#{studentBean.student.lastName}"
                        required="true"/>


                <h:outputLabel value="Email:"/>

                <p:inputText
                        value="#{studentBean.student.email}"
                        required="true"/>

            </p:panelGrid>


            <br/>

            <p:commandButton
                    value="Save"
                    action="#{studentBean.save}"
                    update="@form"/>

        </p:panel>


        <br/>


        <p:dataTable
                id="studentTable"
                value="#{studentBean.students}"
                var="student"
                paginator="true"
                rows="10"
                stripedRows="true">

            <p:column headerText="ID">

                <h:outputText value="#{student.id}"/>

            </p:column>


            <p:column headerText="First Name">

                <h:outputText value="#{student.firstName}"/>

            </p:column>


            <p:column headerText="Last Name">

                <h:outputText value="#{student.lastName}"/>

            </p:column>


            <p:column headerText="Email">

                <h:outputText value="#{student.email}"/>

            </p:column>


            <p:column headerText="Actions">

                <p:commandButton
                        value="Edit"
                        action="#{studentBean.edit(student)}"
                        update="@form"/>


                <p:commandButton
                        value="Delete"
                        action="#{studentBean.delete(student)}"
                        update="@form"
                        style="margin-left:10px;"/>

            </p:column>

        </p:dataTable>

    </h:form>

</h:body>

</html>
